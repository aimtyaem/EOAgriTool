<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOAgriTool — Fields</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="page"><section class="panel"><h1>Fields</h1><p class="muted">Register fields locally and reuse them in reports and recommendations.</p><form id="fieldForm" class="form-grid"><input id="name" required placeholder="Field name"><input id="crop" required placeholder="Crop"><select id="health"><option>good</option><option>fair</option><option>poor</option></select><button class="button">Register field</button></form></section><section class="panel" style="margin-top:20px"><h2>Registered fields</h2><div class="table-wrap"><table class="data-table"><thead><tr><th>Name</th><th>Crop</th><th>Health</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script src="assets/app.js"></script><script>function render(){const rows=document.getElementById('rows'),fields=EOAgri.fields();rows.innerHTML=fields.length?fields.map((f,i)=>`<tr><td>${f.name}</td><td>${f.crop}</td><td>${f.health}</td><td><button class="button secondary" data-remove="${i}">Remove</button></td></tr>`).join(''):'<tr><td colspan="4" class="empty">No fields yet.</td></tr>';rows.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{const f=EOAgri.fields();f.splice(+b.dataset.remove,1);EOAgri.saveFields(f);render()})}document.getElementById('fieldForm').onsubmit=e=>{e.preventDefault();const f=EOAgri.fields();f.push({name:name.value,crop:crop.value,health:health.value,lastUpdated:new Date().toISOString()});EOAgri.saveFields(f);e.target.reset();render();EOAgri.toast('Field registered')};render();</script></body></html>
