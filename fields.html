<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fields | EOAgriTool</title><link rel="stylesheet" href="/assets/styles.css"></head>
<body><script src="/assets/app.js"></script><main class="page">
<section class="panel" style="padding:22px 24px;margin-top:8px"><div class="section-head"><div><h2 style="margin:0">Field operations</h2><div class="muted">Track crop status, field conditions and uploaded media</div></div><button class="button secondary" type="button" onclick="location.href='/dashboard'">Back to dashboard</button></div></section>
<section class="metric-grid" style="margin-top:20px"><article class="panel metric-card"><span class="metric-icon">🌾</span><small>Active fields</small><strong id="activeFieldsCount">0</strong><span class="trend">Local records</span></article><article class="panel metric-card"><span class="metric-icon">💧</span><small>Avg. irrigation</small><strong id="irrigationValue">—</strong><span class="trend">Live ET₀ proxy</span></article><article class="panel metric-card"><span class="metric-icon">🧪</span><small>Soil health</small><strong>70/100</strong><span class="trend">Baseline</span></article><article class="panel metric-card"><span class="metric-icon">📸</span><small>Uploads</small><strong id="mediaCount">0</strong><span class="trend">Local media</span></article></section>
<section class="panel" style="margin-top:14px;padding:14px 18px"><p id="dataRefreshStatus" class="refresh-status" style="margin:0" aria-live="polite"><span class="dot"></span>Live metrics not refreshed</p><div id="dataRefreshBanner" class="refresh-banner" role="status" hidden></div></section>
<section class="content-grid"><article class="panel section-card"><div class="section-head"><div><h3>Field list</h3></div><button class="button" type="button" id="refreshBtn">Refresh live metrics</button></div><div id="fieldsGrid" class="grid"></div></article><article class="panel section-card"><div class="section-head"><div><h3>Add field</h3></div></div><div class="form-grid"><input id="fieldName" type="text" placeholder="Field name"><input id="fieldCrop" type="text" placeholder="Crop type"><select id="fieldHealth"><option value="good">Good health</option><option value="fair">Fair health</option><option value="poor">Poor health</option></select><input id="fieldYield" type="text" placeholder="Expected yield (t/ha)"><input id="mediaUpload" type="file" multiple accept="image/*,video/*"><div id="mediaPreview" class="grid" style="gap:8px"></div><button class="button" type="button" id="saveFieldBtn">Save field</button></div></article></section>
</main><script>
const fieldsGrid=document.getElementById('fieldsGrid'),mediaPreview=document.getElementById('mediaPreview'); let uploadedMedia=[];
function defaultFields(){return [{name:'North Plot 01',crop:'Wheat',health:'good',yield:'6.4 t/ha',lastUpdated:new Date().toISOString(),media:[]},{name:'South Plot 02',crop:'Maize',health:'fair',yield:'5.2 t/ha',lastUpdated:new Date(Date.now()-3600000).toISOString(),media:[]},{name:'Irrigation Basin',crop:'Clover',health:'good',yield:'4.8 t/ha',lastUpdated:new Date(Date.now()-86400000).toISOString(),media:[]}]}
function getFields(){try{const stored=JSON.parse(localStorage.getItem('fieldData')||'null');if(stored&&Array.isArray(stored.fields))return stored.fields}catch(e){}const fallback={fields:defaultFields()};localStorage.setItem('fieldData',JSON.stringify(fallback));return fallback.fields} function saveFields(fields){localStorage.setItem('fieldData',JSON.stringify({fields}))}
function timeAgo(value){const diff=Math.max(1,Math.floor((Date.now()-new Date(value).getTime())/60000));return diff<60?`${diff} min ago`:diff<1440?`${Math.floor(diff/60)} hr ago`:`${Math.floor(diff/1440)} day ago`}
function renderFields(){const fields=getFields();document.getElementById('activeFieldsCount').textContent=fields.length;document.getElementById('mediaCount').textContent=fields.reduce((n,f)=>n+(f.media||[]).length,0);fieldsGrid.innerHTML=fields.length?fields.map(field=>`<article class="panel" style="padding:16px;min-height:200px;position:relative"><div class="risk-dot ${field.health==='poor'?'critical':''}" style="position:absolute;right:16px;top:16px;background:${field.health==='good'?'#1a9f65':field.health==='fair'?'#f4b942':'#d95846'}"></div><div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><div style="width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#126b4a,#33a96d);color:#fff">🌾</div><div><strong style="display:block;color:var(--navy)">${field.name}</strong><span class="muted">${field.crop}</span></div></div><div style="display:grid;gap:6px;margin-top:16px;font-size:.9rem;color:var(--muted)"><div>Yield: <strong style="color:var(--navy)">${field.yield||'N/A'}</strong></div><div>Health: <strong style="color:var(--navy)">${field.health}</strong></div><div>User updated: <strong style="color:var(--navy)">${timeAgo(field.lastUpdated)}</strong></div></div></article>`).join(''):'<div class="empty">No fields yet. Add your first field.</div>'}
async function refreshLiveMetrics(){const status=document.getElementById('dataRefreshStatus'),banner=document.getElementById('dataRefreshBanner'),button=document.getElementById('refreshBtn');button.innerHTML='<span class="spinner"></span> Refreshing';button.disabled=true;status.className='refresh-status';status.innerHTML='<span class="spinner"></span> Loading live metrics';banner.hidden=true;const result=await EOAgri.fetchJSON('/water_data?region=nile_delta');button.disabled=false;button.textContent='Refresh live metrics';if(!result.ok||!result.data){status.className='refresh-status error';status.innerHTML='<span class="dot"></span>Live metrics failed';banner.hidden=false;banner.className='refresh-banner error';banner.textContent=`${result.error||'Live irrigation data is unavailable.'} Field records were not changed.`;return}const d=result.data;document.getElementById('irrigationValue').textContent=d.et0_total_mm==null?'—':`${Number(d.et0_total_mm).toFixed(1)} mm`;const age=EOAgri.formatRefreshedAt(result.fetched_at);status.className=`refresh-status${result.stale?' stale':''}`;status.innerHTML=`<span class="dot"></span>Data refreshed ${age}`;if(result.stale){banner.hidden=false;banner.className='refresh-banner stale';banner.textContent=`Showing last successful irrigation data from ${age}. Field records remain local.`}}
document.getElementById('saveFieldBtn').addEventListener('click',()=>{const name=document.getElementById('fieldName').value.trim(),crop=document.getElementById('fieldCrop').value.trim(),health=document.getElementById('fieldHealth').value,yieldValue=document.getElementById('fieldYield').value.trim()||'N/A';if(!name||!crop){alert('Please complete the field name and crop type.');return}const fields=getFields();fields.push({name,crop,health,yield:yieldValue,lastUpdated:new Date().toISOString(),media:uploadedMedia});saveFields(fields);uploadedMedia=[];mediaPreview.innerHTML='';document.getElementById('fieldName').value='';document.getElementById('fieldCrop').value='';document.getElementById('fieldYield').value='';renderFields()});
document.getElementById('mediaUpload').addEventListener('change',event=>Array.from(event.target.files||[]).forEach(file=>{const reader=new FileReader();reader.onload=e=>{const item=document.createElement('div');item.style.cssText='border:1px solid var(--line);border-radius:12px;padding:8px';item.innerHTML=file.type.startsWith('image/')?`<img src="${e.target.result}" style="width:100%;height:90px;object-fit:cover;border-radius:10px">`:`<video src="${e.target.result}" controls style="width:100%;height:90px;object-fit:cover;border-radius:10px"></video>`;mediaPreview.appendChild(item);uploadedMedia.push({type:file.type,url:e.target.result})};reader.readAsDataURL(file)}));
document.getElementById('refreshBtn').addEventListener('click',refreshLiveMetrics);renderFields();refreshLiveMetrics();
</script></body></html>
