<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EOAgriTool | Login</title>
  <link rel="stylesheet" href="assets/styles.css">
  <style>
    body{padding:0} .login-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(480px,100%);padding:32px;border-radius:26px;background:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.8);box-shadow:var(--shadow);backdrop-filter:blur(18px)}.login-header{text-align:center;margin-bottom:20px}.login-header h1{margin:0 0 6px;font-size:2.2rem;letter-spacing:-.06em}.login-form{display:grid;gap:14px}.login-form input{padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff}.login-form button{width:100%;margin-top:8px}.login-meta{display:flex;justify-content:space-between;align-items:center;font-size:.88rem;color:var(--muted);margin-top:8px}.login-meta a{color:var(--green);font-weight:700}.brand-mark-large{display:grid;place-items:center;width:68px;height:68px;border-radius:18px;background:linear-gradient(135deg,var(--green),var(--green-2));color:#fff;font-size:2rem;box-shadow:0 14px 28px rgba(18,107,74,.2);margin:0 auto 18px}
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="brand-mark-large">🌾</div>
      <div class="login-header">
        <h1>EOAgriTool</h1>
        <div class="muted">Farm intelligence workspace</div>
      </div>
      <form class="login-form" id="loginForm">
        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password" required>
        <button class="button" type="submit">Sign in</button>
      </form>
      <div class="login-meta">
        <label><input type="checkbox"> Remember me</label>
        <a href="#">Need help?</a>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', function (e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value.trim();
      if (!email || !password) return;
      localStorage.setItem('eoagri-auth', 'true');
      location.href = 'dashboard.html';
    });
  </script>
</body>
</html>
