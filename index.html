<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOAgriTool — Sign in</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="page" style="max-width:720px"><section class="panel" style="margin-top:8vh;text-align:center"><div class="brand" style="justify-content:center"><span class="brand-mark">🌾</span><span>EOAgriTool</span></div><h1>Make every field decision clearer.</h1><p class="muted">A standalone farm intelligence workspace for fields, climate, water and actionable recommendations.</p><form id="login" class="form-grid" style="margin:28px auto 0;text-align:left"><label>Email<input id="email" type="email" required placeholder="farmer@example.com"></label><label>Password<input id="password" type="password" required minlength="4" placeholder="••••••••"></label><button class="button" type="submit">Open dashboard</button></form><p class="muted" style="font-size:.85rem">Demo mode: credentials are stored only in this browser.</p></section></main><script src="assets/app.js"></script><script>document.getElementById('login').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('eoagri-auth',document.getElementById('email').value);location.href='dashboard.html'});</script></body></html>
