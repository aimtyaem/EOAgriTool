<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOAgriTool | Login</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="page" style="min-height:100vh;display:grid;place-items:center"><section class="panel" style="width:min(480px,100%);text-align:center"><div class="brand" style="justify-content:center"><span class="brand-mark">🌾</span><span>EOAgriTool</span></div><h1>Decision support for resilient farms.</h1><p class="muted">Explore NASA Earth observation context, local soil information, crop characteristics and farmer priorities in one connected workspace.</p><form id="loginForm" class="form-grid" style="margin:24px auto;text-align:left"><input id="email" type="email" placeholder="Email address" required><input id="password" type="password" placeholder="Password" required><button class="button" type="submit">Open farm workspace</button></form><small class="muted">Demo authentication stores only a local browser flag.</small></section></main><script>document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();localStorage.setItem('eoagri-auth','true');location.href='dashboard.html'});</script></body></html>
