<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EOAgriTool | Login</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="page" style="min-height:100vh;display:grid;place-items:center">
    <section class="panel" style="width:min(480px,100%);text-align:center">
      <div class="brand" style="justify-content:center"><span class="brand-mark">🌾</span><span>EOAgriTool</span></div>
      <h1>Decision support for resilient farms.</h1>
      <p class="muted">Explore NASA Earth observation context, local soil information, crop characteristics and farmer priorities in one connected workspace.</p>
      <form id="loginForm" class="form-grid" style="margin:24px auto;text-align:left">
        <input id="email" name="email" type="email" autocomplete="email" placeholder="Email address" required>
        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Password" required>
        <button class="button" type="submit">Open farm workspace</button>
      </form>
      <small class="muted">Demo authentication accepts any valid email and password.</small>
    </section>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', function (event) {
      event.preventDefault();

      const email = document.getElementById('email').value.trim();
      if (!email) return;

      localStorage.setItem('eoagri-auth', 'true');
      localStorage.setItem('eoagri-user-email', email);
      window.location.assign(location.hostname.endsWith('github.io') ? 'dashboard.html' : '/dashboard');
    });
  </script>
</body>
</html>
