<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>EOAgriTool — Water</title><link rel="stylesheet" href="assets/styles.css"></head><body><main class="page"><section class="panel"><h1>Water resources</h1><p class="muted">Compare irrigation demand with local supply and use the result in your agronomic plan.</p><div class="grid"><div class="card stat"><small>Annual demand</small><strong>1,020 mm</strong></div><div class="card stat"><small>Current use</small><strong>867 mm</strong></div><div class="card stat"><small>Efficiency target</small><strong>90%</strong></div><div class="card stat"><small>Recommendation</small><strong>Drip</strong></div></div><button class="button" id="analyse" style="margin-top:20px">Analyse irrigation</button><div id="result" class="muted"></div></section></main><script src="assets/app.js"></script><script>analyse.onclick=async()=>{analyse.disabled=true;const r=await EOAgri.recommendations({irrigation_mm:1020,deficit_mm:-25},{previous_crop:'wheat'});result.innerHTML='<h2>Actions</h2>'+r.map(x=>`<p><b>${x.title}</b><br>${x.action||x.description}</p>`).join('');analyse.disabled=false}</script></body></html>
