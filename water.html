<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Water | EOAgriTool</title>
    <link rel="stylesheet" href="/assets/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <main class="page">
      <section class="panel" style="padding:22px 24px"><div class="section-head"><div><h2 style="margin:0;font-size:2rem">Water &amp; irrigation</h2><div class="muted">Live soil moisture, evapotranspiration and irrigation-deficit monitoring.</div></div><span class="live-dot">Live forecast</span></div></section>
      <section class="panel" id="waterControls" style="margin-top:20px;padding:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">
        <label class="muted" for="regionSelect">Region</label><select id="regionSelect" style="padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff"><option value="nile_delta">Nile Delta</option><option value="sahel">Sahel</option><option value="mediterranean">Mediterranean</option><option value="southeast_asia">SE Asia</option></select>
        <button class="button" type="button" id="refreshWaterBtn">Refresh</button><span class="refresh-status" id="refreshStatus" aria-live="polite"><span class="dot"></span>Not refreshed</span><div class="refresh-banner" id="refreshBanner" role="status" hidden></div>
      </section>
      <section class="metric-grid" style="margin-top:20px" aria-live="polite">
        <article class="panel metric-card"><span class="metric-icon">💧</span><small>Soil moisture</small><strong id="soilValue">—</strong><span class="trend">7-day average</span></article>
        <article class="panel metric-card"><span class="metric-icon">🚿</span><small>Irrigation deficit</small><strong id="deficitValue">—</strong><span class="trend">ET₀ less rainfall</span></article>
        <article class="panel metric-card"><span class="metric-icon">☀️</span><small>Evapotranspiration</small><strong id="et0Value">—</strong><span class="trend">7-day total</span></article>
        <article class="panel metric-card"><span class="metric-icon">⚠️</span><small>Water risk</small><strong id="riskValue">—</strong><span class="trend">Derived from live data</span></article>
      </section>
      <section class="content-grid"><article class="panel section-card"><div class="section-head"><div><h3>Water balance trend</h3></div></div><div class="chart-wrap" style="height:320px"><canvas id="waterChart"></canvas></div></article><article class="panel section-card"><div class="section-head"><div><h3>Water signals</h3></div></div><div class="risk-list" id="waterSignals"></div></article></section>
    </main>
    <script src="/assets/app.js"></script>
    <script>
      let waterChart = null; const $ = id => document.getElementById(id); const controls = $('waterControls');
      function banner(message, kind='') { const node=$('refreshBanner'); node.hidden=!message; node.className=`refresh-banner ${kind}`.trim(); node.textContent=message; }
      function renderSignals(data) { const deficit=Number(data.irrigation_deficit_mm), soil=Number(data.soil_moisture_avg), rain=Number(data.rain_total_mm); const items=[{title:deficit>30?'High irrigation deficit':'Irrigation balance',description:deficit>30?`${deficit.toFixed(1)} mm of additional irrigation may be needed.`:'Forecast rainfall offsets most reference evapotranspiration.',critical:deficit>30},{title:soil<.2?'Low soil moisture':'Soil moisture baseline',description:soil<.2?'Average soil moisture is below the monitoring threshold.':'Average soil moisture is within the monitoring range.',critical:soil<.2},{title:rain<5?'Limited rainfall':'Rainfall contribution',description:rain<5?'Only limited rainfall is forecast for this period.':`${rain.toFixed(1)} mm of rainfall is included in the balance.`,critical:rain<5}]; $('waterSignals').innerHTML=items.map(item=>`<div class="risk-item"><i class="risk-dot ${item.critical?'critical':''}"></i><div><strong>${item.title}</strong><span>${item.description}</span></div></div>`).join(''); }
      function renderChart(series) { const count=Math.max(series.soil_moisture?.length||0,series.et0?.length||0); const labels=Array.from({length:count},(_,i)=>`H+${i+1}`); waterChart?.destroy(); waterChart=new Chart($('waterChart'),{type:'line',data:{labels,datasets:[{label:'Soil moisture',data:series.soil_moisture||[],borderColor:'#126b4a',backgroundColor:'rgba(18,107,74,.08)',fill:true,tension:.35,yAxisID:'y'},{label:'ET₀ (mm)',data:series.et0||[],borderColor:'#f4b942',backgroundColor:'rgba(244,185,66,.08)',fill:true,tension:.35,yAxisID:'y1'}]},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},plugins:{legend:{position:'bottom'}},scales:{y:{title:{display:true,text:'Soil moisture'}},y1:{position:'right',title:{display:true,text:'ET₀ mm'},grid:{drawOnChartArea:false}}}}}); }
      async function refreshWater(){ controls.setAttribute('aria-busy','true'); $('refreshWaterBtn').innerHTML='<span class="spinner"></span> Refreshing'; $('refreshStatus').className='refresh-status'; $('refreshStatus').innerHTML='<span class="spinner"></span> Loading live data'; banner(''); const result=await EOAgri.fetchJSON(`/water_data?region=${encodeURIComponent($('regionSelect').value)}`); controls.removeAttribute('aria-busy'); $('refreshWaterBtn').textContent='Refresh'; if(!result.ok||!result.data){$('refreshStatus').className='refresh-status error';$('refreshStatus').innerHTML='<span class="dot"></span>Refresh failed';banner(`${result.error||'Live water data is unavailable.'} Existing chart data was preserved.`,'error');return;} const d=result.data; $('soilValue').textContent=d.soil_moisture_avg==null?'—':`${(Number(d.soil_moisture_avg)*100).toFixed(1)}%`; $('deficitValue').textContent=d.irrigation_deficit_mm==null?'—':`${Number(d.irrigation_deficit_mm).toFixed(1)} mm`; $('et0Value').textContent=d.et0_total_mm==null?'—':`${Number(d.et0_total_mm).toFixed(1)} mm`; $('riskValue').textContent=Number(d.irrigation_deficit_mm)>30||Number(d.soil_moisture_avg)<.2?'Elevated':Number(d.irrigation_deficit_mm)>15?'Moderate':'Low'; renderChart(d.series||{}); renderSignals(d); const age=EOAgri.formatRefreshedAt(result.fetched_at); $('refreshStatus').className=`refresh-status${result.stale?' stale':''}`; $('refreshStatus').innerHTML=`<span class="dot"></span>Updated ${age}`; if(result.stale) banner(`Live refresh unavailable. Showing the last successful reading from ${age}.`,'stale'); }
      $('regionSelect').addEventListener('change',refreshWater); $('refreshWaterBtn').addEventListener('click',refreshWater); refreshWater();
    </script>
  </body>
</html>
