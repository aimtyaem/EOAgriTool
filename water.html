<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Climate | EOAgriTool</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <script src="assets/app.js"></script>
  <main class="page">
    <section class="panel" style="padding:22px 24px;">
      <div class="section-head">
        <div>
          <h2 style="margin:0; font-size:2rem;">Climate intelligence</h2>
          <div class="muted">Forecast horizon and climate risk monitoring</div>
        </div>
        <span class="live-dot">WeatherNext2</span>
      </div>
    </section>

    <section class="panel" style="margin-top:20px; padding:16px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
      <label class="muted">Region</label>
      <select id="regionSelect" style="padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff;">
        <option value="nile_delta">Nile Delta</option>
        <option value="sahel">Sahel</option>
        <option value="mediterranean">Mediterranean</option>
        <option value="southeast_asia">SE Asia</option>
      </select>
      <label class="muted">Horizon</label>
      <select id="horizonSelect" style="padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:#fff;">
        <option value="72h" selected>72h</option>
        <option value="7d">7d</option>
        <option value="30d">30d</option>
      </select>
      <button class="button" type="button" id="runClimateBtn">Run analysis</button>
    </section>

    <section class="metric-grid" style="margin-top:20px;">
      <article class="panel metric-card"><span class="metric-icon">🌡️</span><small>Temp</small><strong id="tempValue">25.7°C</strong><span class="trend">↗ +0.8°C</span></article>
      <article class="panel metric-card"><span class="metric-icon">🌧️</span><small>Rain</small><strong id="rainValue">365 mm</strong><span class="trend">↘ -4%</span></article>
      <article class="panel metric-card"><span class="metric-icon">💨</span><small>Wind</small><strong id="windValue">3.9 m/s</strong><span class="trend">↗ mild</span></article>
      <article class="panel metric-card"><span class="metric-icon">⚠️</span><small>Risk</small><strong id="riskValue">Moderate</strong><span class="trend">Heat + drought</span></article>
    </section>

    <section class="content-grid">
      <article class="panel section-card">
        <div class="section-head"><div><h3>Forecast trend</h3></div></div>
        <div class="chart-wrap"><canvas id="forecastChart"></canvas></div>
      </article>
      <article class="panel section-card">
        <div class="section-head"><div><h3>Climate signals</h3></div></div>
        <div class="risk-list" id="climateSignals"></div>
      </article>
    </section>
  </main>

  <script>
    const climateData = {
      nile_delta: { temp: [24.5, 24.8, 25.1, 25.4, 25.7, 26.1, 26.6], rain: [420, 390, 365, 340, 325, 308, 290], wind: [3.2, 3.6, 3.8, 4.1, 4.0, 3.9, 4.2], risk: 'Moderate' },
      sahel: { temp: [29.8, 30.1, 30.4, 30.7, 30.9, 31.3, 31.8], rain: [480, 460, 440, 420, 405, 390, 370], wind: [4.1, 4.0, 4.3, 4.4, 4.2, 4.5, 4.6], risk: 'High' },
      mediterranean: { temp: [20.1, 20.3, 20.8, 21.2, 21.4, 21.9, 22.2], rain: [590, 570, 560, 540, 522, 505, 488], wind: [4.8, 4.7, 4.9, 5.0, 5.2, 5.1, 5.3], risk: 'Low' },
      southeast_asia: { temp: [28.1, 28.4, 28.7, 29.0, 29.2, 29.5, 29.8], rain: [1360, 1290, 1225, 1190, 1150, 1120, 1085], wind: [2.8, 2.9, 2.8, 3.0, 3.1, 3.2, 3.4], risk: 'Moderate' }
    };

    const sensorData = [
      { title: 'Heat stress risk', description: 'Two-day persistent heat pattern above the seasonal baseline.' },
      { title: 'Moisture stress', description: 'Rainfall is trending below the recent 30-day median.' },
      { title: 'Wind turbulence', description: 'Increased wind velocity may affect irrigation efficiency.' }
    ];

    function renderSignals() {
      document.getElementById('climateSignals').innerHTML = sensorData.map(item => `
        <div class="risk-item">
          <i class="risk-dot"></i>
          <div>
            <strong>${item.title}</strong>
            <span>${item.description}</span>
          </div>
        </div>
      `).join('');
    }

    function updateClimate() {
      const region = document.getElementById('regionSelect').value;
      const d = climateData[region];
      const lastTemp = d.temp[d.temp.length - 1];
      const lastRain = d.rain[d.rain.length - 1];
      const lastWind = d.wind[d.wind.length - 1];
      document.getElementById('tempValue').textContent = `${lastTemp.toFixed(1)}°C`;
      document.getElementById('rainValue').textContent = `${lastRain.toFixed(0)} mm`;
      document.getElementById('windValue').textContent = `${lastWind.toFixed(1)} m/s`;
      document.getElementById('riskValue').textContent = d.risk;

      const ctx = document.getElementById('forecastChart');
      new Chart(ctx, {
        type: 'line',
        data: {
          labels: ['H+24', 'H+48', 'H+72', 'H+120', 'H+168', 'H+240', 'H+336'],
          datasets: [
            { label: 'Temperature', data: d.temp, borderColor: '#126b4a', backgroundColor: 'rgba(18,107,74,.08)', fill: true, tension: .35 },
            { label: 'Rainfall', data: d.rain.map(v => v / 8), borderColor: '#2f7eea', backgroundColor: 'rgba(47,126,234,.06)', fill: true, tension: .35 }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { position: 'bottom' } },
          scales: { y: { grid: { color: 'rgba(19,43,61,.06)' } } }
        }
      });
    }

    document.getElementById('runClimateBtn').addEventListener('click', updateClimate);
    renderSignals();
    updateClimate();
  </script>
</body>
</html>
