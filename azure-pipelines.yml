# Python to Linux Web App on Azure
# Builds and deploys the Quart application to Azure App Service.

trigger:
  branches:
    include:
      - gh-pages
  paths:
    exclude:
      - "idle-models-repo/**"
      - "another-idle-repo/**"

variables:
  azureServiceConnectionId: "7e9c32cf-a856-4c63-8168-ee2d580b91bd"
  webAppName: "EOAgriTool"
  vmImageName: "ubuntu-latest"
  environmentName: "EOAgriTool"
  projectRoot: "$(System.DefaultWorkingDirectory)"
  pythonVersion: "3.12"

  # Configure AzureOpenAIKey and CosmosDbAccountKey as secret pipeline variables
  # or, preferably, load them from an Azure DevOps variable group / Key Vault.
  azureOpenAIEndpoint: "$(AZURE_OPENAI_ENDPOINT)"
  azureOpenAIKey: "$(AzureOpenAIKey)"
  azureOpenAIModel: "$(AZURE_OPENAI_MODEL)"
  cosmosAccount: "$(AZURE_COSMOSDB_ACCOUNT)"
  cosmosAccountKey: "$(CosmosDbAccountKey)"

stages:
  - stage: Build
    displayName: Build stage
    jobs:
      - job: BuildJob
        pool:
          vmImage: $(vmImageName)
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: "$(pythonVersion)"
            displayName: "Use Python $(pythonVersion)"

          - script: |
              python -m pip install --upgrade pip
              pip install --requirement requirements.txt
              python -m compileall -q app.py backend
            workingDirectory: $(projectRoot)
            displayName: "Install dependencies and validate Python"

          - task: ArchiveFiles@2
            displayName: Archive application
            inputs:
              rootFolderOrFile: "$(projectRoot)"
              includeRootFolder: false
              archiveType: zip
              archiveFile: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
              replaceExistingArchive: true
              exclude: |
                .git/**
                .venv/**
                venv/**
                **/__pycache__/**
                **/*.pyc
                idle-models-repo/**
                another-idle-repo/**

          - upload: "$(Build.ArtifactStagingDirectory)/$(Build.BuildId).zip"
            displayName: Upload package
            artifact: drop

  - stage: Deploy
    displayName: Deploy Web App
    dependsOn: Build
    condition: succeeded()
    jobs:
      - deployment: DeploymentJob
        pool:
          vmImage: $(vmImageName)
        environment: $(environmentName)
        strategy:
          runOnce:
            deploy:
              steps:
                - task: AzureWebApp@2
                  displayName: Deploy EOAgriTool to Azure App Service
                  inputs:
                    azureSubscription: $(azureServiceConnectionId)
                    appType: webAppLinux
                    appName: $(webAppName)
                    package: "$(Pipeline.Workspace)/drop/$(Build.BuildId).zip"
                    startUpCommand: "hypercorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
                    appSettings: >-
                      -SCM_DO_BUILD_DURING_DEPLOYMENT true
                      -PORT 8000
                      -LOG_LEVEL INFO
                      -FLASK_DEBUG false
                      -AZURE_OPENAI_ENDPOINT "$(azureOpenAIEndpoint)"
                      -AZURE_OPENAI_KEY "$(azureOpenAIKey)"
                      -AZURE_OPENAI_MODEL "$(azureOpenAIModel)"
                      -AZURE_OPENAI_PREVIEW_API_VERSION 2024-06-01
                      -AZURE_COSMOSDB_ACCOUNT "$(cosmosAccount)"
                      -AZURE_COSMOSDB_ACCOUNT_KEY "$(cosmosAccountKey)"
                      -AZURE_COSMOSDB_DATABASE eoagritool
                      -AZURE_COSMOSDB_CONVERSATIONS_CONTAINER conversations
                      -COSMOS_INIT_TIMEOUT_SECONDS 30
                      -MAX_CONVERSATION_MESSAGES_FOR_TITLE 10
                      -MS_DEFENDER_ENABLED false
                      -APP_USER_AGENT EOAgriTool/AsyncAzureOpenAI/2.0.0
